services:
  - type: web
    name: prime-bot-web
    runtime: docker
    region: frankfurt
    plan: free
    repo: https://github.com/ilaizurovv-ctrl/Prime-bot
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BOT_USERNAME
        value: PrimeGarantBft_bot
      - key: BOT_DISPLAY_NAME
        value: Prime Bot
      - key: TON_NETWORK
        value: testnet
      - key: ESCROW_FEE_BPS
        value: "150"
      - key: ADMIN_IDS
        value: "8717928428"
      - key: MANAGER_USERNAME
        value: korhoul
