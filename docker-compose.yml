services:
  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elf
      POSTGRES_PASSWORD: elf_password
      POSTGRES_DB: elf_otc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elf -d elf_otc"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
